# Lokalny development: Postgres + API + osobny worker. Panel: `cd web && npm run dev`.
# Nie uruchamiano w środowisku, w którym powstał kod (brak demona Docker) — patrz docs/PROGRESS.md.
x-worker-env: &env
  DATABASE_URL: postgresql://mdb:mdb@db:5432/mdb
  AUTH_MODE: local
  JWT_SECRET: ${JWT_SECRET:-dev-secret-dev-secret-dev-secret-0000}
  STORAGE_MODE: local
  STORAGE_DIR: /data
  CORS_ORIGINS: http://localhost:3000

services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: mdb, POSTGRES_PASSWORD: mdb, POSTGRES_DB: mdb }
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U mdb"], interval: 3s, retries: 20 }
  migrate:
    build: { context: ., dockerfile: worker/Dockerfile }
    environment: *env
    command: ["python", "-m", "app.migrate", "--local-shim"]
    depends_on: { db: { condition: service_healthy } }
  api:
    build: { context: ., dockerfile: worker/Dockerfile }
    environment: *env
    ports: ["8000:8000"]
    volumes: [files:/data]
    depends_on: { migrate: { condition: service_completed_successfully } }
  worker:
    build: { context: ., dockerfile: worker/Dockerfile }
    environment: *env
    command: ["python", "-m", "app.worker"]
    volumes: [files:/data]
    depends_on: { migrate: { condition: service_completed_successfully } }

volumes: { dbdata: {}, files: {} }
